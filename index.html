<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevVoca — 개발자 영단어 퀴즈</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #21262d;
      --border: #30363d;
      --accent: #58a6ff;
      --accent2: #3fb950;
      --accent3: #f78166;
      --accent4: #d2a8ff;
      --warn: #e3b341;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --text-sub: #c9d1d9;
      --red: #f85149;
      --green: #3fb950;
      --radius: 10px;
      --radius-sm: 6px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 60px;
    }

    /* ── Header ── */
    .header {
      width: 100%; max-width: 640px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 0 20px;
    }
    .logo {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.3rem; font-weight: 700;
      color: var(--accent); cursor: pointer;
      transition: opacity .2s;
    }
    .logo:hover { opacity: .75; }
    .logo span { color: var(--accent2); }
    .home-btn {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 6px 14px;
      font-family: 'JetBrains Mono', monospace; font-size: .78rem;
      color: var(--text-muted); cursor: pointer; display: none;
      transition: all .2s;
    }
    .home-btn:hover { border-color: var(--accent); color: var(--accent); }
    .home-btn.show { display: block; }

    /* ── Card ── */
    .card {
      width: 100%; max-width: 640px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden;
    }
    .progress-bar-wrap { height: 3px; background: var(--surface2); }
    .progress-bar {
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent4));
      transition: width .4s ease; width: 0%;
    }

    /* ── Start Screen ── */
    .start-screen { padding: 32px 28px 28px; }
    .start-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem; color: var(--text-muted); margin-bottom: 5px;
    }
    .start-desc {
      font-size: .85rem; color: var(--text-muted);
      margin-bottom: 28px; line-height: 1.65;
    }

    /* Toggle-style setting rows */
    .settings-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
    .setting-row {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 12px 16px;
    }
    .setting-label {
      font-family: 'JetBrains Mono', monospace; font-size: .7rem;
      color: var(--accent4); margin-bottom: 10px; letter-spacing: .5px;
    }
    .toggle-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .tog-btn {
      padding: 7px 16px; border-radius: 20px;
      border: 1px solid var(--border); background: transparent;
      font-family: 'JetBrains Mono', monospace; font-size: .8rem;
      color: var(--text-muted); cursor: pointer; transition: all .15s;
    }
    .tog-btn:hover { border-color: var(--accent); color: var(--accent); }
    .tog-btn.sel { background: var(--accent); border-color: var(--accent); color: #0d1117; font-weight: 700; }

    /* Estimated time */
    .est-time {
      font-family: 'JetBrains Mono', monospace; font-size: .78rem;
      color: var(--text-muted); margin-bottom: 20px; padding: 10px 14px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); display: flex; align-items: center; gap: 8px;
    }
    .est-time span { color: var(--accent); font-weight: 700; }

    .start-btn {
      width: 100%; background: var(--accent); color: #0d1117;
      border: none; border-radius: var(--radius-sm); padding: 14px;
      font-family: 'JetBrains Mono', monospace; font-weight: 700;
      font-size: .95rem; cursor: pointer; transition: opacity .2s;
    }
    .start-btn:hover { opacity: .85; }

    /* ── Status Row ── */
    .status-row {
      display: none; align-items: center; justify-content: space-between;
      padding: 14px 20px 10px; border-bottom: 1px solid var(--border);
    }
    .stat-group { display: flex; align-items: center; gap: 16px; }
    .stat-item {
      display: flex; align-items: center; gap: 5px;
      font-family: 'JetBrains Mono', monospace; font-size: .8rem;
    }
    .stat-label { color: var(--text-muted); }
    .stat-val { color: var(--text); font-weight: 600; }
    .lives { display: flex; gap: 4px; }
    .heart { font-size: 1rem; transition: transform .3s; }
    .heart.lost { filter: grayscale(1) opacity(.3); transform: scale(.8); }
    .heart-inf { font-size: .9rem; color: var(--accent); font-family: 'JetBrains Mono', monospace; }

    /* Timer ring */
    .timer-ring { position: relative; width: 42px; height: 42px; }
    .timer-ring svg { transform: rotate(-90deg); }
    .timer-ring circle { fill: none; stroke-width: 3; }
    .timer-ring .bg { stroke: var(--surface2); }
    .timer-ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 1s linear, stroke .5s; }
    .timer-num {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: 'JetBrains Mono', monospace; font-size: .75rem; font-weight: 700;
    }

    /* ── Quiz Zone ── */
    .quiz-zone { padding: 22px 24px 18px; display: none; }
    .q-counter { font-family: 'JetBrains Mono', monospace; font-size: .72rem; color: var(--text-muted); margin-bottom: 10px; }
    .q-counter span { color: var(--accent); }
    .hint-label { font-size: .72rem; color: var(--accent4); font-family: 'JetBrains Mono', monospace; margin-bottom: 6px; }
    .hint-box {
      background: var(--surface2); border: 1px solid var(--border);
      border-left: 3px solid var(--accent); border-radius: var(--radius-sm);
      padding: 14px 16px; font-size: 1rem; line-height: 1.65;
      color: var(--text-sub); min-height: 56px;
    }
    
    /* Quiz - End */
    .quit-btn {
      background: transparent; border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 10px 18px;
      font-family: 'JetBrains Mono', monospace; font-size: .82rem;
      color: var(--text-muted); cursor: pointer;
      transition: all .2s; margin-right: auto;
    }
    .quit-btn:hover { border-color: var(--red); color: var(--red); background: rgba(248,81,73,.06); }

    /* Choices */
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
    .choice-btn {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 13px 14px;
      font-family: 'JetBrains Mono', monospace; font-size: .9rem;
      color: var(--text); cursor: pointer; text-align: left;
      transition: all .15s; position: relative; overflow: hidden;
    }
    .choice-btn::before {
      content: attr(data-key); position: absolute; top: 6px; right: 9px;
      font-size: .65rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace;
    }
    .choice-btn:hover:not(:disabled) { border-color: var(--accent); background: rgba(88,166,255,.08); }
    .choice-btn.correct { border-color: var(--green); background: rgba(63,185,80,.12); color: var(--green); }
    .choice-btn.wrong   { border-color: var(--red);   background: rgba(248,81,73,.1);   color: var(--red); }
    .choice-btn:disabled { cursor: default; }

    /* Short answer */
    .input-wrap { margin-top: 18px; position: relative; }
    .input-wrap input {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 13px 50px 13px 16px;
      font-family: 'JetBrains Mono', monospace; font-size: 1rem;
      color: var(--text); outline: none; transition: border-color .2s;
    }
    .input-wrap input:focus { border-color: var(--accent); }
    .input-wrap input.correct { border-color: var(--green); }
    .input-wrap input.wrong   { border-color: var(--red); }
    .input-submit {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: var(--accent); border: none; border-radius: 4px;
      width: 32px; height: 28px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: #0d1117; font-weight: 700; font-size: .9rem; transition: opacity .2s;
    }
    .input-submit:disabled { opacity: .4; cursor: default; }

    /* Feedback */
    .feedback { margin-top: 14px; padding: 11px 14px; border-radius: var(--radius-sm); font-size: .9rem; font-weight: 500; display: none; }
    .feedback.show { display: block; }
    .feedback.ok      { background: rgba(63,185,80,.1);   border: 1px solid rgba(63,185,80,.3);   color: var(--green); }
    .feedback.fail    { background: rgba(248,81,73,.08);  border: 1px solid rgba(248,81,73,.25);  color: var(--red); }
    .feedback.timeout { background: rgba(227,179,65,.08); border: 1px solid rgba(227,179,65,.3);  color: var(--warn); }

    /* Sentences accordion */
    .sentences-wrap { margin-top: 12px; }
    .sentences-toggle {
      width: 100%; background: transparent; border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 9px 14px;
      color: var(--accent4); font-family: 'JetBrains Mono', monospace; font-size: .78rem;
      cursor: pointer; display: flex; align-items: center; justify-content: space-between;
      transition: all .2s;
    }
    .sentences-toggle:hover { border-color: var(--accent4); background: rgba(210,168,255,.05); }
    .sentences-toggle .arrow { transition: transform .25s; }
    .sentences-toggle.open .arrow { transform: rotate(180deg); }
    .sentences-panel { overflow: hidden; max-height: 0; transition: max-height .3s ease; }
    .sentences-panel.open { max-height: 800px; }
    .sentence-item { padding: 10px 14px 8px; border-left: 2px solid var(--border); margin: 8px 0 0; }
    .sentence-type { font-family: 'JetBrains Mono', monospace; font-size: .7rem; color: var(--accent); margin-bottom: 3px; }
    .sentence-en { font-size: .88rem; color: var(--text-sub); line-height: 1.5; }
    .sentence-ko { font-size: .82rem; color: var(--text-muted); margin-top: 3px; cursor: pointer; border: none; background: none; padding: 0; font-family: inherit; text-align: left; }
    .sentence-ko.hidden { color: transparent; text-shadow: 0 0 8px rgba(139,148,158,.8); }

    /* Action row */
    .action-row { padding: 14px 24px 20px; display: none; justify-content: flex-end; }
    .next-btn {
      background: var(--accent); color: #0d1117; border: none;
      border-radius: var(--radius-sm); padding: 10px 24px;
      font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: .88rem;
      cursor: pointer; display: flex; align-items: center; gap: 6px;
      transition: opacity .2s, transform .1s;
    }
    .next-btn:hover { opacity: .85; transform: translateY(-1px); }
    .next-btn:disabled { opacity: .3; cursor: default; transform: none; }

    /* Score screen */
    .score-screen { display: none; padding: 36px 28px; text-align: center; }
    .score-screen.show { display: block; }
    .score-big { font-family: 'JetBrains Mono', monospace; font-size: 3.5rem; font-weight: 700; color: var(--accent); line-height: 1; }
    .score-label { color: var(--text-muted); margin-top: 6px; font-size: .88rem; }
    .score-breakdown { display: flex; justify-content: center; gap: 28px; margin: 22px 0; }
    .score-stat { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .score-stat-num { font-family: 'JetBrains Mono', monospace; font-size: 1.4rem; font-weight: 700; }
    .s-ok { color: var(--green); } .s-ng { color: var(--red); } .s-to { color: var(--warn); }
    .score-stat-label { font-size: .75rem; color: var(--text-muted); }
    .score-msg { font-size: .9rem; color: var(--text-sub); margin-bottom: 8px; }
    .score-time { font-family: 'JetBrains Mono', monospace; font-size: .78rem; color: var(--text-muted); margin-bottom: 22px; }
    .restart-btn {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 11px 28px;
      color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: .88rem;
      cursor: pointer; transition: border-color .2s;
    }
    .restart-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* Game Over screen */
    .gameover-screen { display: none; padding: 36px 28px; text-align: center; }
    .gameover-screen.show { display: block; }
    .gameover-icon { font-size: 2.5rem; margin-bottom: 10px; }
    .gameover-word { font-family: 'JetBrains Mono', monospace; font-size: 1.4rem; font-weight: 700; color: var(--red); margin: 10px 0 4px; }
    .gameover-sub { font-size: .85rem; color: var(--text-muted); margin-bottom: 22px; }

    /* Notification toast */
    .toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 24px; padding: 10px 22px;
      font-family: 'JetBrains Mono', monospace; font-size: .82rem;
      color: var(--text); box-shadow: 0 4px 20px rgba(0,0,0,.4);
      transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .35s;
      opacity: 0; z-index: 999; white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* Footer */
    .footer-note { margin-top: 18px; font-family: 'JetBrains Mono', monospace; font-size: .68rem; color: var(--border); }

    /* Animations */
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
    @keyframes pop   { 0%{transform:scale(1)} 50%{transform:scale(1.12)} 100%{transform:scale(1)} }
    .shake { animation: shake .35s ease; }
    .pop   { animation: pop .22s ease; }
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="logo" id="logoHome">Dev<span>Voca</span></div>
  <button class="home-btn" id="homeBtn">⌂ 홈으로</button>
</div>

<div class="card">
  <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>

  <!-- ── Start Screen ── -->
  <div class="start-screen" id="startScreen">
    <div class="start-title">⚙게임 설정</div>
    <div class="start-desc">개발자들이 자주 접하는 영단어를 퀴즈로 학습하세요.</div>

    <div class="settings-list">
      <!-- 문제 수 -->
      <div class="setting-row">
        <div class="setting-label">🎫문제 수</div>
        <div class="toggle-group" id="togQCount">
          <button class="tog-btn sel" data-val="10">10문제</button>
          <button class="tog-btn"     data-val="30">30문제</button>
          <button class="tog-btn"     data-val="9999">모든 문제</button>
        </div>
      </div>
      <!-- 목숨 수 -->
      <div class="setting-row">
        <div class="setting-label">🩸목숨 수</div>
        <div class="toggle-group" id="togLives">
          <button class="tog-btn sel" data-val="0">무한 ∞</button>
          <button class="tog-btn"     data-val="3">3개 ♥♥♥</button>
          <button class="tog-btn"     data-val="2">2개 ♥♥</button>
          <button class="tog-btn"     data-val="1">1개 ♥</button>
        </div>
      </div>
      <!-- 제한 시간 -->
      <div class="setting-row">
        <div class="setting-label">⏳제한 시간</div>
        <div class="toggle-group" id="togTimer">
          <button class="tog-btn sel" data-val="0">무한 ∞</button>
          <button class="tog-btn"     data-val="30">30초 ⏱</button>
          <button class="tog-btn"     data-val="10">10초 ⚡</button>
        </div>
      </div>
      <!-- 문제 유형 -->
      <div class="setting-row">
        <div class="setting-label">🎲문제 유형</div>
        <div class="toggle-group" id="togMode">
          <button class="tog-btn sel" data-val="choice">4지선다</button>
          <button class="tog-btn"     data-val="short">단답형</button>
        </div>
      </div>
    </div>

    <!-- 예상 소요 시간 -->
    <div class="est-time" id="estTime">
      ⏳ 예상 소요 시간: <span id="estVal">약 2분</span>
    </div>

    <button class="start-btn" id="startBtn">▷ 게임 시작</button>
  </div>

  <!-- ── Status Row ── -->
  <div class="status-row" id="statusRow">
    <div class="stat-group">
      <div class="stat-item">
        <span class="stat-label">Q</span>
        <span class="stat-val" id="qNum">1</span>
        <span class="stat-label" id="qTotalDisp">/10</span>
      </div>
      <div class="lives" id="livesDisplay"></div>
    </div>
    <div class="timer-ring" id="timerRing">
      <svg viewBox="0 0 42 42" width="42" height="42">
        <circle class="bg" cx="21" cy="21" r="18"/>
        <circle class="fg" id="timerCircle" cx="21" cy="21" r="18" stroke-dasharray="113.1" stroke-dashoffset="0"/>
      </svg>
      <div class="timer-num" id="timerNum">∞</div>
    </div>
  </div>

  <!-- ── Quiz Zone ── -->
  <div class="quiz-zone" id="quizZone">
    <div class="q-counter">Question <span id="qCurrent">1</span> / <span id="qTotal">10</span></div>
    <div class="hint-label">// 힌트</div>
    <div class="hint-box" id="hintBox"></div>

    <div class="choices" id="choicesWrap"></div>

    <div class="input-wrap" id="inputWrap" style="display:none">
      <input type="text" id="answerInput" placeholder="영단어를 입력하세요..." autocomplete="off" spellcheck="false">
      <button class="input-submit" id="submitBtn">↵</button>
    </div>

    <div class="feedback" id="feedbackBox"></div>

    <div class="sentences-wrap" id="sentencesWrap" style="display:none">
      <button class="sentences-toggle" id="sentencesToggle">
        <span>💬 간단영문장 보기</span><span class="arrow">▾</span>
      </button>
      <div class="sentences-panel" id="sentencesPanel"></div>
    </div>
  </div>

  <!-- ── Action Row ── -->
  <div class="action-row" id="actionRow">
    <button class="quit-btn" id="quitBtn">✕ 문제풀기 종료</button>
    <button class="next-btn" id="nextBtn" disabled>다음 문제 →</button>
  </div>

  <!-- ── Game Over Screen ── -->
  <div class="gameover-screen" id="gameoverScreen">
    <div class="gameover-icon">💀</div>
    <div style="color:var(--text-muted);font-size:.9rem">목숨을 모두 잃었습니다</div>
    <div class="gameover-word" id="gameoverWord"></div>
    <div class="gameover-sub"  id="gameoverSub"></div>
    <div id="gameoverSentences" style="margin-bottom:22px"></div>
    <button class="restart-btn" id="gameoverRestart">↩ 다시 시작</button>
  </div>

  <!-- ── Score Screen ── -->
  <div class="score-screen" id="scoreScreen">
    <div class="score-big" id="scorePct">0%</div>
    <div class="score-label">게임 종료!</div>
    <div class="score-breakdown">
      <div class="score-stat"><div class="score-stat-num s-ok" id="scoreCorrect">0</div><div class="score-stat-label">정답</div></div>
      <div class="score-stat"><div class="score-stat-num s-ng" id="scoreWrong">0</div><div class="score-stat-label">오답</div></div>
      <div class="score-stat"><div class="score-stat-num s-to" id="scoreTimeout">0</div><div class="score-stat-label">시간초과</div></div>
    </div>
    <div class="score-msg" id="scoreMsg"></div>
    <div class="score-time" id="scoreTimeRow"></div>
    <button class="restart-btn" id="restartBtn">↩ 다시 시작</button>
  </div>
</div>

<div class="footer-note">DevVoca · last update 26.04.25</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════
//  WORD DATABASE
// ══════════════════════════════════════════════════════════
const words = [
  // ── 기존 단어 ─────────────────────────────────────────
  { word:"represent", hint:"1.대표하다, 나타내다", comment:{title:"represent",parts:[{type:"동사 (To represent)",example:"He was chosen to represent his country at the Olympics.",translation:"그는 올림픽에 나갈 국가대표로 선발되었다."},{type:"형용사 (Representative)",example:"This work is representative of her style.",translation:"이 작품은 그녀의 스타일을 대표합니다."},{type:"명사 (representative)",example:"Each state sends representatives to the event.",translation:"각 주에서는 행사에 대표를 파견합니다."}]}},
  { word:"examine", hint:"1.조사하다, 진찰하다, 검토하다<br>2.본질적인 상태, 원인을 들여다보는", comment:{title:"examine",parts:[{type:"동사 (examine)",example:"The police will examine the evidence.",translation:"경찰이 증거를 조사할 것입니다."},{type:"명사 (Examination)",example:"The doctor's examination was thorough.",translation:"의사의 검사는 철저했다."}]}},

const toastEl         = document.getElementById('toast');

// ══════════════════════════════════════════════════════════
//  TOGGLE BUTTONS (설정 화면)
// ══════════════════════════════════════════════════════════
function initToggles(groupId, stateKey, onChange) {
  const wrap = document.getElementById(groupId);
  wrap.querySelectorAll('.tog-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      wrap.querySelectorAll('.tog-btn').forEach(b => b.classList.remove('sel'));
      btn.classList.add('sel');
      cfg[stateKey] = btn.dataset.val;
      if (onChange) onChange();
      updateEstTime();
    });
  });
}
initToggles('togQCount', 'qCount');
initToggles('togLives',  'lives');
initToggles('togTimer',  'timer');
initToggles('togMode',   'mode');

function updateEstTime() {
  const q  = cfg.qCount === '9999' ? words.length : parseInt(cfg.qCount);
  const t  = parseInt(cfg.timer);
  let secs;
  if (t === 0) secs = q * 10; // 제한없음: 문제당 평균 10초 추정
  else secs = q * t;
  const mins = Math.ceil(secs / 60);
  estVal.textContent = `약 ${mins}분 (${q}문제)`;
}
updateEstTime();

// ══════════════════════════════════════════════════════════
//  TOAST
// ══════════════════════════════════════════════════════════
let toastTimer = null;
function showToast(msg, duration = 2800) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), duration);
}

// ══════════════════════════════════════════════════════════
//  HOME
// ══════════════════════════════════════════════════════════
function goHome() {
  stopTimer();
  gameStarted = false;
  // 퀴즈 내부 상태 초기화
  choicesWrap.innerHTML = '';
  inputWrap.style.display = 'none';
  answerInput.value = '';
  answerInput.className = '';
  answerInput.disabled = false;
  submitBtn.disabled = false;
  feedbackBox.className = 'feedback';
  sentencesWrap.style.display = 'none';
  sentencesToggle.classList.remove('open');
  sentencesPanel.classList.remove('open');
  sentencesPanel.innerHTML = '';
  nextBtn.disabled = true;
  scoreScreen.classList.remove('show');
  gameoverScreen.classList.remove('show');
  statusRow.style.display = 'none';
  quizZone.style.display = 'none';
  actionRow.style.display = 'none';
  progressBar.style.width = '0%';
  startScreen.style.display = 'block';
  homeBtn.classList.remove('show');
}
function confirmGoHome() {
  if (!gameStarted) { goHome(); return; }
  if (confirm(`정말 종료하시겠어요? 지금까지의 결과로 채점됩니다.`)) goHome();
}
homeBtn.addEventListener('click', confirmGoHome);
logoHome.addEventListener('click', confirmGoHome);

// ══════════════════════════════════════════════════════════
//  TIMER
// ══════════════════════════════════════════════════════════
function startTimer() {
  stopTimer();
  timeLeft = timerDuration > 0 ? timerDuration : 9999;
  updateTimerUI();
  if (timerDuration === 0) return; // 무한: 타이머 작동 안 함
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerUI();
    if (timeLeft <= 0) { stopTimer(); handleTimeout(); }
  }, 1000);
}
function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}
function updateTimerUI() {
  if (timerDuration === 0) {
    timerNum.textContent = '∞';
    timerCircle.style.strokeDashoffset = 0;
    timerCircle.style.stroke = 'var(--accent)';
    return;
  }
  timerNum.textContent = timeLeft;
  const pct = timeLeft / timerDuration;
  timerCircle.style.strokeDashoffset = CIRCUMFERENCE * (1 - pct);
  timerCircle.style.stroke = pct > 0.5 ? 'var(--accent)' : pct > 0.25 ? 'var(--warn)' : 'var(--red)';
}
function handleTimeout() {
  answered = true;
  scoreTimeout++;
  showFeedback('timeout', `⏰ 시간 초과! 정답: <strong style="color:var(--text)">${currentWord.word}</strong>`);
  if (gameMode === 'choice') markChoicesOnTimeout();
  else { answerInput.classList.add('wrong'); answerInput.disabled = true; submitBtn.disabled = true; }
  showSentences();
  // lives check on timeout
  if (maxLives > 0) {
    lives--;
    renderLives();
    if (lives <= 0) { setTimeout(showGameOver, 900); return; }
  }
  nextBtn.disabled = false;
}

// ══════════════════════════════════════════════════════════
//  LIVES
// ══════════════════════════════════════════════════════════
function renderLives() {
  livesDisplay.innerHTML = '';
  if (maxLives === 0) {
    const inf = document.createElement('span');
    inf.className = 'heart-inf';
    inf.textContent = '∞';
    livesDisplay.appendChild(inf);
    return;
  }
  for (let i = 0; i < maxLives; i++) {
    const h = document.createElement('span');
    h.className = 'heart' + (i >= lives ? ' lost' : '');
    h.textContent = '♥';
    livesDisplay.appendChild(h);
  }
}

// ══════════════════════════════════════════════════════════
//  CHOICES — shuffle every round
// ══════════════════════════════════════════════════════════
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function getChoices(correct) {
  const pool = shuffle(words.filter(w => w.word !== correct.word)).slice(0, 3);
  return shuffle([...pool, correct]);
}

// ══════════════════════════════════════════════════════════
//  START GAME
// ══════════════════════════════════════════════════════════
function startGame() {
  const rawQ = cfg.qCount === '9999' ? words.length : parseInt(cfg.qCount);
  qCount       = Math.min(rawQ, words.length);
  maxLives     = parseInt(cfg.lives);
  lives        = maxLives;
  timerDuration= parseInt(cfg.timer);
  gameMode     = cfg.mode;
  usedIndices  = [];
  scoreCorrect = scoreWrong = scoreTimeout = qDone = 0;

  startScreen.style.display = 'none';
  scoreScreen.classList.remove('show');
  gameoverScreen.classList.remove('show');
  statusRow.style.display = 'flex';
  quizZone.style.display = 'block';
  actionRow.style.display = 'flex';
  homeBtn.classList.add('show');
  gameStarted = true;

  const realQCount = qCount === words.length ? `전체 (${words.length})` : qCount;
  qTotal.textContent = qCount;
  qTotalDisp.textContent = '/' + qCount;
  renderLives();

  gameStartTime = Date.now();
  showToast(`🚀 게임 시작! 총 ${realQCount}문제`);
  nextQuestion();
}

// ══════════════════════════════════════════════════════════
//  NEXT QUESTION
// ══════════════════════════════════════════════════════════
function nextQuestion() {
  if (qDone >= qCount) { endGame(); return; }

  answered = false;
  feedbackBox.className = 'feedback';
  sentencesWrap.style.display = 'none';
  sentencesToggle.classList.remove('open');
  sentencesPanel.classList.remove('open');
  nextBtn.disabled = true;

  // Pick random unused word
  const available = words.map((_, i) => i).filter(i => !usedIndices.includes(i));
  const idx = available[Math.floor(Math.random() * available.length)];
  usedIndices.push(idx);
  currentWord = words[idx];

  // Progress
  progressBar.style.width = (qDone / qCount * 100) + '%';
  qDone++;
  qNum.textContent = qDone;
  qCurrent.textContent = qDone;

  hintBox.innerHTML = currentWord.hint;

  if (gameMode === 'choice') {
    inputWrap.style.display = 'none';
    choicesWrap.style.display = 'grid';
    renderChoices();
  } else {
    choicesWrap.style.display = 'none';
    inputWrap.style.display = 'block';
    answerInput.value = '';
    answerInput.className = '';
    answerInput.disabled = false;
    submitBtn.disabled = false;
    setTimeout(() => answerInput.focus(), 50);
  }

  startTimer();
}

// ══════════════════════════════════════════════════════════
//  RENDER CHOICES (shuffled every round)
// ══════════════════════════════════════════════════════════
function renderChoices() {
  const choices = getChoices(currentWord);
  const keys = ['A','B','C','D'];
  choicesWrap.innerHTML = '';
  choices.forEach((w, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.setAttribute('data-key', keys[i]);
    btn.textContent = w.word;
    btn.addEventListener('click', () => selectChoice(btn, w));
    choicesWrap.appendChild(btn);
  });
}
function selectChoice(btn, word) {
  if (answered) return;
  answered = true;
  stopTimer();
  const isCorrect = word.word === currentWord.word;
  Array.from(choicesWrap.children).forEach(b => b.disabled = true);
  if (isCorrect) {
    btn.classList.add('correct', 'pop');
    scoreCorrect++;
    showFeedback('ok', '✓ 정답입니다!');
    showSentences();
    nextBtn.disabled = false;
  } else {
    btn.classList.add('wrong', 'shake');
    Array.from(choicesWrap.children).forEach(b => { if (b.textContent === currentWord.word) b.classList.add('correct'); });
    scoreWrong++;
    if (maxLives > 0) { lives--; renderLives(); }
    showFeedback('fail', `✗ 오답! 정답: <strong style="color:var(--text)">${currentWord.word}</strong>`);
    showSentences();
    if (maxLives > 0 && lives <= 0) { setTimeout(showGameOver, 900); return; }
    nextBtn.disabled = false;
  }
}
function markChoicesOnTimeout() {
  Array.from(choicesWrap.children).forEach(b => {
    b.disabled = true;
    if (b.textContent === currentWord.word) b.classList.add('correct');
  });
}

// ══════════════════════════════════════════════════════════
//  QUIT GAME
// ══════════════════════════════════════════════════════════
quitBtn.addEventListener('click', () => {
  if (!gameStarted || !confirm('정말 종료하시겠어요? 지금까지의 결과로 채점됩니다.')) return;
  // 현재 문제에 아직 답하지 않았으면 오답 처리
  if (!answered) { scoreWrong++; qDone++; }
  showResult(true);
});


// ══════════════════════════════════════════════════════════
//  SHORT ANSWER
// ══════════════════════════════════════════════════════════
function checkShortAnswer() {
  if (answered) return;
  const val = answerInput.value.toLowerCase().trim();
  if (!val) return;
  answered = true;
  stopTimer();
  if (val === currentWord.word.toLowerCase()) {
    answerInput.classList.add('correct');
    answerInput.disabled = true; submitBtn.disabled = true;
    scoreCorrect++;
    showFeedback('ok', '✓ 정답입니다!');
    showSentences();
    nextBtn.disabled = false;
  } else {
    answerInput.classList.add('wrong', 'shake');
    answerInput.disabled = true; submitBtn.disabled = true;
    scoreWrong++;
    if (maxLives > 0) { lives--; renderLives(); }
    showFeedback('fail', `✗ 오답! 정답: <strong style="color:var(--text)">${currentWord.word}</strong>`);
    showSentences();
    if (maxLives > 0 && lives <= 0) { setTimeout(showGameOver, 900); return; }
    nextBtn.disabled = false;
  }
}

// ══════════════════════════════════════════════════════════
//  FEEDBACK
// ══════════════════════════════════════════════════════════
function showFeedback(type, msg) {
  feedbackBox.innerHTML = msg;
  feedbackBox.className = 'feedback show ' + type;
}

// ══════════════════════════════════════════════════════════
//  SENTENCES ACCORDION
// ══════════════════════════════════════════════════════════
function buildSentencesHTML(parts) {
  return parts.map(p => `
    <div class="sentence-item">
      <div class="sentence-type">${p.type}</div>
      <div class="sentence-en">${p.example}</div>
      <button class="sentence-ko hidden" title="클릭하면 번역 보기">${p.translation}</button>
    </div>`).join('');
}
function bindKoBtns(container) {
  container.querySelectorAll('.sentence-ko').forEach(b => b.addEventListener('click', () => b.classList.toggle('hidden')));
}
function showSentences() {
  if (!currentWord.comment || !currentWord.comment.parts) return;
  sentencesPanel.innerHTML = buildSentencesHTML(currentWord.comment.parts);
  bindKoBtns(sentencesPanel);
  sentencesWrap.style.display = 'block';
}
sentencesToggle.addEventListener('click', () => {
  sentencesToggle.classList.toggle('open');
  sentencesPanel.classList.toggle('open');
});

// ══════════════════════════════════════════════════════════
//  GAME OVER
// ══════════════════════════════════════════════════════════
function showGameOver() {
  stopTimer();
  quizZone.style.display = 'none';
  actionRow.style.display = 'none';
  statusRow.style.display = 'none';
  progressBar.style.width = '100%';
  document.getElementById('gameoverWord').textContent = currentWord.word;
  document.getElementById('gameoverSub').textContent = `정답: ${currentWord.hint.replace(/<br>/g,' ').replace(/<[^>]+>/g,'')}`;
  const goSent = document.getElementById('gameoverSentences');
  if (currentWord.comment && currentWord.comment.parts) {
    goSent.innerHTML = `
      <button class="sentences-toggle" id="goToggle"><span>💬 간단영문장 보기</span><span class="arrow">▾</span></button>
      <div class="sentences-panel" id="goPanel">${buildSentencesHTML(currentWord.comment.parts)}</div>`;
    document.getElementById('goToggle').addEventListener('click', function() {
      this.classList.toggle('open');
      document.getElementById('goPanel').classList.toggle('open');
    });
    bindKoBtns(goSent);
  } else goSent.innerHTML = '';
  gameoverScreen.classList.add('show');
  showToast('💀 게임 오버! 다시 도전해보세요.');
}

// ══════════════════════════════════════════════════════════
//  SHOW RESULT (endGame & quit 공통)
// ══════════════════════════════════════════════════════════
function showResult(isQuit = false) {
  stopTimer();
  quizZone.style.display = 'none';
  actionRow.style.display = 'none';
  statusRow.style.display = 'none';
  progressBar.style.width = '100%';

  // 소요 시간 계산
  const elapsed = Math.floor((Date.now() - gameStartTime) / 1000);
  const elMin = Math.floor(elapsed / 60);
  const elSec = elapsed % 60;
  const elapsedStr = elMin > 0
    ? `${elMin}분 ${elSec}초`
    : `${elSec}초`;

  // 중도 종료: 현재 문제(답 안 한 경우)는 오답 처리, 분모는 출제된 문제 수
  const totalAnswered = isQuit ? qDone : qCount;
  const pct = totalAnswered > 0 ? Math.round((scoreCorrect / totalAnswered) * 100) : 0;

  document.getElementById('scorePct').textContent = pct + '%';
  document.getElementById('scoreCorrect').textContent = scoreCorrect;
  document.getElementById('scoreWrong').textContent = scoreWrong;
  document.getElementById('scoreTimeout').textContent = scoreTimeout;

  const msgs = ['🎯 완벽합니다! 최고예요!', '👏 훌륭해요! 거의 다 맞췄네요.', '💪 절반 이상! 계속 연습하세요.', '📚 아직 갈 길이 있어요. 다시 도전!'];
  const msgIdx = pct >= 90 ? 0 : pct >= 70 ? 1 : pct >= 50 ? 2 : 3;
  const prefix = isQuit ? '⚡ 중도 종료 · ' : '';
  document.getElementById('scoreMsg').textContent = prefix + msgs[msgIdx];

  // 소요 시간 표시
  const timeRowEl = document.getElementById('scoreTimeRow');
  timeRowEl.textContent = `⏱ 소요 시간: ${elapsedStr}`;

  scoreScreen.classList.add('show');
  gameStarted = false;
  homeBtn.classList.add('show');

  if (isQuit) showToast(`⚡ 종료! ${totalAnswered}문제 중 ${scoreCorrect}개 정답 (${pct}%)`);
  else showToast(`🏁 게임 완료! 정답률 ${pct}% · ${elapsedStr}`);
}

function endGame() { showResult(false); }

// ══════════════════════════════════════════════════════════
//  RESTART
// ══════════════════════════════════════════════════════════
function restart() { goHome(); }

// ══════════════════════════════════════════════════════════
//  EVENT LISTENERS
// ══════════════════════════════════════════════════════════
startBtn.addEventListener('click', startGame);
nextBtn.addEventListener('click', nextQuestion);
restartBtn.addEventListener('click', restart);
gameoverRestart.addEventListener('click', restart);
submitBtn.addEventListener('click', checkShortAnswer);
answerInput.addEventListener('keydown', e => { if (e.key === 'Enter') checkShortAnswer(); });
document.addEventListener('keydown', e => {
  if (!gameStarted || answered || gameMode !== 'choice') return;
  const map = { a:0, b:1, c:2, d:3 };
  const i = map[e.key.toLowerCase()];
  if (i !== undefined) { const btns = Array.from(choicesWrap.children); if (btns[i]) btns[i].click(); }
});
</script>
